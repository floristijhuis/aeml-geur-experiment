<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geur en geheugen</title>
<meta name="theme-color" content="#F7E8E4">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
:root {
  --navy: #07162C;
  --blue-dark: #1C345B;
  --red: #B02A3C;
  --blush: #F7E8E4;
  --dur-fast: 140ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--blush);
  color: var(--navy);
  font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { width: min(100%, 560px); display: grid; gap: 28px; }
h1 {
  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 700;
  font-stretch: 106%;
  letter-spacing: -0.018em;
  font-size: clamp(2rem, 6vw, 2.75rem);
  line-height: 1.1;
}
p { font-size: 1.15rem; line-height: 1.55; color: rgba(7, 22, 44, 0.74); }
nav { display: grid; gap: 14px; }
a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 76px;
  border-radius: 999px;
  border: 2px solid var(--navy);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--navy);
  text-decoration: none;
  transition: transform var(--dur-fast) var(--ease-out);
}
a.primary { background: var(--navy); color: var(--blush); }
a:active { transform: scale(0.94); }
a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Geur en geheugen</h1>
  <p>Open op de iPad de tablet-versie, en op de laptop bij het grote scherm het scherm-overzicht.</p>
  <nav>
    <a class="primary" href="tablet.html">Tablet (voor de kinderen)</a>
    <a href="display.html">Groot scherm</a>
  </nav>
</main>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
